<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | LBB Immanuel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Open Sans', sans-serif;
        }

        body {
            background-color: #f0f4f9; /* Google light blue-grey */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #1f1f1f;
        }

        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 448px;
            padding: 48px 40px 36px;
            border-radius: 28px;
            /* subtle shadow */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .logo-icon {
            font-size: 2.5rem;
            color: #0b57d0; /* Google blue */
            margin-bottom: 16px;
        }

        .login-card h1 {
            font-size: 2.25rem;
            font-weight: 400;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .login-card p {
            font-size: 1rem;
            color: #444746;
            margin-bottom: 32px;
            font-weight: 400;
        }

        .form-group {
            position: relative;
            margin-bottom: 16px;
            text-align: left;
        }

        .form-control {
            width: 100%;
            padding: 16px 14px;
            font-size: 1rem;
            color: #1f1f1f;
            background: transparent;
            border: 1px solid #747775;
            border-radius: 4px;
            transition: 0.2s ease all;
            outline: none;
        }

        /* Float label styles */
        .form-label {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            color: #444746;
            pointer-events: none;
            transition: 0.2s ease all;
            background: #ffffff;
            padding: 0 4px;
            margin-left: -4px;
        }

        .form-control:focus, 
        .form-control:not(:placeholder-shown) {
            border-color: #0b57d0;
            border-width: 2px;
            padding: 15px 13px; /* Adjust padding due to border width change */
        }

        .form-control:focus ~ .form-label, 
        .form-control:not(:placeholder-shown) ~ .form-label {
            top: 0;
            font-size: 0.75rem;
            color: #0b57d0;
            font-weight: 500;
        }

        /* Error state for invalid input */
        .form-control.error {
            border-color: #b3261e;
        }
        .form-control.error ~ .form-label {
            color: #b3261e;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 32px;
        }

        .btn-submit {
            background-color: #0b57d0;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 0.875rem;
            font-weight: 500;
            letter-spacing: 0.25px;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background-color: #0842a0;
            box-shadow: 0 1px 3px 1px rgba(0, 0, 0, 0.15), 0 1px 2px 0 rgba(0, 0, 0, 0.3);
        }

        .btn-submit:disabled {
            background-color: #e0e0e0;
            color: #a8a8a8;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Mobile tweaks */
        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
                border-radius: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                box-shadow: none;
            }
            body { background-color: #ffffff; }
        }
    </style>
</head>
<body>

    <div class="login-card">
        <i class="fa-solid fa-graduation-cap logo-icon"></i>
        <h1>Portal Admin</h1>
        <p>Gunakan Akun LBB Immanuel Anda</p>

        <form id="admin-login-form">
            <div class="form-group">
                <input type="email" id="email" class="form-control" placeholder=" " required autocomplete="email">
                <label for="email" class="form-label">Email</label>
            </div>
            
            <div class="form-group">
                <input type="password" id="password" class="form-control" placeholder=" " required autocomplete="current-password">
                <label for="password" class="form-label">Masukkan sandi Anda</label>
            </div>

            <div class="actions">
                <button type="submit" class="btn-submit" id="btn-submit">
                    Selanjutnya
                </button>
            </div>
        </form>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC04h_Aaz9I9WncNeEWc8A5cEKajmIEDVs",
            authDomain: "cbt-lbb-immanuel.firebaseapp.com",
            databaseURL: "https://cbt-lbb-immanuel-default-rtdb.firebaseio.com",
            projectId: "cbt-lbb-immanuel",
            storageBucket: "cbt-lbb-immanuel.firebasestorage.app",
            messagingSenderId: "79589552415",
            appId: "1:79589552415:web:20fb83aa055ec156cfc02a"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // 1. Redirect to admin-home.html if already logged in
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'admin-home.html';
            }
        });

        // 2. Logic Login
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const btnSubmit = document.getElementById('btn-submit');

            // Reset errors
            emailInput.classList.remove('error');
            passwordInput.classList.remove('error');

            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Memproses...';

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    btnSubmit.innerHTML = '<i class="fa-solid fa-circle-check"></i> Sukses';
                    window.location.href = 'admin-home.html'; // REDIRECT KE HOME
                })
                .catch((error) => {
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'Selanjutnya';
                    
                    let errorMessage = 'Gagal login. Silakan coba lagi.';
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                        errorMessage = 'Tidak dapat menemukan Akun Admin Anda.';
                        emailInput.classList.add('error');
                    } else if (error.code === 'auth/wrong-password') {
                        errorMessage = 'Sandi salah. Coba lagi.';
                        passwordInput.classList.add('error');
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = 'Terlalu banyak percobaan gagal. Coba lagi nanti.';
                    }

                    Swal.fire({
                        icon: 'error',
                        title: 'Akses Ditolak',
                        text: errorMessage,
                        confirmButtonColor: '#0b57d0'
                    });
                });
        });
    </script>
</body>
</html>
