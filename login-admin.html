<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login | LBB Immanuel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #28a745;
            --secondary: #007bff;
            --bg-body: #f4f6f9;
            --text-main: #2c3e50;
            --font-heading: 'Nunito', sans-serif;
            --font-body: 'Open Sans', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        body {
            font-family: var(--font-body);
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 20px;
            position: relative;
            overflow: hidden;
        }

        .login-box::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 5px;
            background: var(--secondary);
        }

        .header-text {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-text i {
            font-size: 3rem;
            color: var(--secondary);
            margin-bottom: 10px;
        }

        .header-text h2 {
            font-family: var(--font-heading);
            font-weight: 800;
            color: #1e293b;
        }

        .header-text p {
            color: #6c757d;
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #adb5bd;
        }

        .form-control {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
            background: #f8fafc;
        }

        .form-control:focus {
            border-color: var(--secondary);
            background: white;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--secondary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .btn-login:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="login-box">
        <div class="header-text">
            <i class="fa-solid fa-user-shield"></i>
            <h2>Portal Admin</h2>
            <p>LBB Immanuel CBT System</p>
        </div>

        <form id="admin-login-form">
            <div class="form-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="email" class="form-control" placeholder="Email Admin" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" class="form-control" placeholder="Password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-login" id="btn-submit">
                MASUK <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 5px;"></i>
            </button>
        </form>
    </div>

    <script>
        // Konfigurasi Firebase persis seperti di system.js milikmu
        const firebaseConfig = {
            apiKey: "AIzaSyC04h_Aaz9I9WncNeEWc8A5cEKajmIEDVs",
            authDomain: "cbt-lbb-immanuel.firebaseapp.com",
            databaseURL: "https://cbt-lbb-immanuel-default-rtdb.firebaseio.com",
            projectId: "cbt-lbb-immanuel",
            storageBucket: "cbt-lbb-immanuel.firebasestorage.app",
            messagingSenderId: "79589552415",
            appId: "1:79589552415:web:20fb83aa055ec156cfc02a"
        };

        // Inisialisasi Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();

        // 1. CEK OTOMATIS: Kalau admin sudah pernah login, langsung lempar ke dashboard
        auth.onAuthStateChanged(user => {
            if (user) {
                // Pastikan nama file dashboard admin sesuai (admin.html)
                window.location.href = 'admin-tryout.html';
            }
        });

        // 2. LOGIKA LOGIN EMAIL & PASSWORD
        document.getElementById('admin-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const btnSubmit = document.getElementById('btn-submit');

            // UI Loading state
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = 'Memeriksa... <i class="fa-solid fa-spinner fa-spin"></i>';

            Swal.fire({
                title: 'Authenticating',
                text: 'Mencocokkan kredensial...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    Swal.fire({
                        icon: 'success',
                        title: 'Akses Diterima',
                        text: 'Selamat datang kembali, Admin!',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'admin-tryout.html';
                    });
                })
                .catch((error) => {
                    // Penanganan error jika password salah atau email tidak ada
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = 'MASUK <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 5px;"></i>';
                    
                    let errorMessage = 'Gagal login. Silakan coba lagi.';
                    if (error.code === 'auth/user-not-found') {
                        errorMessage = 'Email tidak terdaftar sebagai Admin.';
                    } else if (error.code === 'auth/wrong-password') {
                        errorMessage = 'Password salah!';
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = 'Terlalu banyak percobaan gagal. Coba lagi nanti.';
                    }

                    Swal.fire({
                        icon: 'error',
                        title: 'Akses Ditolak',
                        text: errorMessage
                    });
                });
        });
    </script>
</body>
</html>
