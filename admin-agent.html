    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';</script>

    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
            --bg-main: #f1f5f9; --text-dark: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --radius: 12px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; }
        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }
        a, button, .card { transition: all 0.2s ease; }

        /* LAYOUT UTAMA */
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; z-index: 100; box-shadow: var(--shadow); }
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; padding-bottom: 0; scroll-behavior: smooth;}
        
        .brand { padding: 0 20px 20px 20px; font-size: 1.3rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 15px;}
        .nav-item { padding: 12px 20px; margin: 4px 15px; border-radius: 8px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none;}
        .nav-item:hover { background: #f8fafc; color: var(--primary); transform: translateX(5px); }
        .nav-item.active { background: #eff6ff; color: var(--primary); }

        .top-navbar { background: white; padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .container { padding: 25px; max-width: 1500px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; height: calc(100vh - 65px); }

        /* MOBILE BOTTOM NAV */
        .bottom-nav { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding-bottom: 80px; } 
            .container { height: calc(100vh - 65px - 80px); padding: 0 !important; gap: 0 !important; }
            .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border); z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); padding-bottom: env(safe-area-inset-bottom); }
            .bottom-nav-item { flex: 1; text-align: center; padding: 12px 5px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none;}
            .bottom-nav-item i { font-size: 1.3rem; margin-bottom: 2px;}
            .bottom-nav-item.active { color: var(--primary); }
            
            .chat-history-sidebar { display: none !important; position: absolute; z-index: 100; height: 100%; top: 0; left: 0; width: 85%; max-width: 320px; border-radius: 0; box-shadow: 5px 0 25px rgba(0,0,0,0.15); border-right: 1px solid var(--border); }
            .chat-history-sidebar.active-mobile { display: flex !important; }
            .chat-wrapper { border: none; border-radius: 0; box-shadow: none; }
            .chat-input-area { padding: 12px 15px; }
            .chat-header { padding: 12px 15px; }
            .chat-messages { padding: 15px; }
            .btn-toggle-history { display: flex !important; }
        }
        .btn-toggle-history { display: none; align-items: center; justify-content: center; background: #f8fafc; border: 1px solid var(--border); color: var(--text-dark); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 1rem; }
        .mobile-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15,23,42,0.4); z-index: 95; backdrop-filter: blur(2px); }
        .mobile-overlay.active { display: block; }

        /* KOMPONEN UI */
        .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(37,99,235,0.3); }
        
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #f8fafc; transition: 0.2s; }
        .form-control:focus { background: white; border-color: var(--primary); }

        /* CHAT UI */
        .chat-wrapper { background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-header { background: white; color: var(--text-dark); padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border); }
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: white; scroll-behavior: smooth; }
        
        .msg-bubble { max-width: 85%; padding: 12px 18px; font-size: 0.95rem; line-height: 1.6; position: relative; }
        .msg-bubble p:first-child { margin-top: 0; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        
        /* Gemini Style Bubbles */
        .msg-user { background: #f0f4f9; color: #1f1f1f; align-self: flex-end; border-radius: 20px; box-shadow: none; border: none; padding: 12px 20px; }
        .msg-ai { background: transparent; color: var(--text-dark); align-self: flex-start; border-radius: 0; box-shadow: none; border: none; padding: 5px 10px; display: flex; gap: 15px; flex-direction: column; width: 100%; max-width: 95%; }
        
        /* Markdown Table CSS */
        .msg-ai table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9rem; }
        .msg-ai th, .msg-ai td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .msg-ai th { background: #f8fafc; font-weight: 700; color: var(--text-dark); }
        .msg-ai tr:nth-child(even) { background-color: #f8fafc; }
        
        /* THINKING BLOCK (Details/Summary) */
        details.think-block { background: transparent; margin-bottom: 15px; }
        details.think-block summary { cursor: pointer; font-weight: 600; color: #64748b; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; user-select: none; padding: 6px 16px; border-radius: 20px; transition: 0.2s; background: #f1f5f9; }
        details.think-block summary:hover { background: #e2e8f0; }
        details.think-block summary::-webkit-details-marker { display: none; }
        details.think-block > div { padding: 12px 15px 12px 20px; border-left: 2px solid #cbd5e1; margin-left: 15px; margin-top: 10px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #64748b; white-space: pre-wrap; word-break: break-word; }
        
        .chat-input-area { padding: 15px 25px; background: white; display: flex; gap: 15px; align-items: center; }
        .chat-input { flex: 1; border: 1px solid #d1d5db; border-radius: 24px; padding: 15px 20px; font-size: 1rem; background: #f8fafc; resize: none; overflow: hidden; min-height: 52px; max-height: 150px; font-family: 'Inter', sans-serif;}
        .chat-input:focus { background: white; border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        .btn-send { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; flex-shrink: 0;}
        .btn-send:hover { transform: scale(1.05); background: #1765cc; }
        .btn-send:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none; }

        .typing-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 10px 15px; background: transparent; align-self: flex-start; margin-bottom: 15px; margin-left: 10px;}
        .dot { width: 8px; height: 8px; background: #1a73e8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        pre { background: #f0f4f9; color: #1f1f1f; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-size: 0.85rem; border: 1px solid #e5e7eb; }
        code { font-family: 'Consolas', monospace; }
        .msg-ai p code { background: #f0f4f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; border: 1px solid #e5e7eb;}
        
        .chat-history-sidebar { width: 300px; background: white; border-radius: var(--radius); border: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow); flex-shrink: 0; }
        .chat-history-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; transition: 0.2s; }
        .chat-history-item:hover { background: #f8fafc; }
        .chat-history-item.active { background: #eff6ff; border-left: 3px solid var(--primary); }
        .chat-title { font-weight: 600; font-size: 0.9rem; color: var(--text-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-date { font-size: 0.75rem; color: var(--text-muted); }
        .chat-actions { display: none; align-items: center; gap: 8px; margin-top: 5px; }
        .chat-history-item:hover .chat-actions { display: flex; }
        
        .attachment-badge { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; color: #475569; position: relative; }
        .attachment-badge .remove { cursor: pointer; color: var(--danger); font-weight: bold; }
        
        @media (max-width: 992px) {
            .container { flex-direction: column !important; }
            .chat-history-sidebar { width: 100%; height: 200px; flex-shrink: 0; }
        }

    </style>
</head>

    <script>
        
        // =======================================================================
        // 1. INISIALISASI FIREBASE
        // =======================================================================
        const firebaseConfig = { apiKey: "AIzaSyC04h_Aaz9I9WncNeEWc8A5cEKajmIEDVs", authDomain: "cbt-lbb-immanuel.firebaseapp.com", databaseURL: "https://cbt-lbb-immanuel-default-rtdb.firebaseio.com", projectId: "cbt-lbb-immanuel", storageBucket: "cbt-lbb-immanuel.firebasestorage.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();

        auth.onAuthStateChanged(user => { if (!user) window.location.replace('login-admin.html'); });

        // =======================================================================
        // 2. GEMINI API SETUP
        // =======================================================================
        let ACTUAL_MODEL_RAW = localStorage.getItem('cbt_active_model') || "gemini-3.1-flash-lite";

        function changeActiveModel(skipAlert = false) {
            const selector = document.getElementById('agent-model-selector');
            ACTUAL_MODEL_RAW = selector.value;
            localStorage.setItem('cbt_active_model', ACTUAL_MODEL_RAW);
            
            // Update subtitle powered by
            const providerName = ACTUAL_MODEL_RAW.startsWith('openrouter:') ? 'OpenRouter' : 'Google Gemini';
            const cleanName = ACTUAL_MODEL_RAW.replace('openrouter:', '').replace('groq:', '');
            
            let labelElement = document.getElementById('current-model-label');
            if(labelElement) labelElement.innerText = `Powered by ${providerName} (${cleanName})`;
            
            if(!skipAlert) {
                Swal.fire({
                    toast: true,
                    position: 'top-end',
                    icon: 'success',
                    title: 'Model AI Diubah!',
                    text: `Sekarang menggunakan: ${cleanName}`,
                    showConfirmButton: false,
                    timer: 3000
                });
            }
        }

        // Context & Sessions
        let chatHistory = [];
        let allChats = [];
        let currentChatId = null;
        let pendingAttachments = [];
        
        // System instruction
        const systemInstruction = {
            parts: [{
                text: "Kamu adalah CBT AI Agent, asisten super cerdas untuk Master Admin dari sistem Computer Based Test. " +
                      "Tugasmu adalah membantu mengelola data ujian, soal, dan melihat statistik/sesi siswa. " +
                      "Gunakan fungsi (tools) yang disediakan untuk membaca data dari database atau melakukan update. " +
                      "Selalu jelaskan apa yang akan kamu lakukan ke dalam pesanmu sebelum memberikan jawaban akhir. " +
                      "PENTING: Jika Admin meminta untuk mengecek durasi ujian, waktu pengerjaan, atau nilai siswa yang sudah selesai, GUNAKAN tool get_sessions_by_paket untuk membaca data sesinya terlebih dahulu. Setelah mendapatkan sessionId, kamu bisa menggunakan tool update_session untuk mengedit waktu pengerjaan atau nilai (membutuhkan persetujuan). " +
                      "Untuk menambah/menghapus siswa dan tryout, kamu HARUS menggunakan tool. " +
                      "Jika Admin ingin membuat, mengubah, atau menghapus jadwal pendaftaran yang muncul di halaman Blogger, gunakan alat get_registration_events, create_registration_event, update_registration_event, dan delete_registration_event." +
                      "Jika Admin meminta untuk memasang link pembahasan, masukkan ke parameter url_pembahasan pada alat update_tryout (JANGAN DIMASUKKAN KE petunjuk). " +
                      "Jika Admin ingin membatalkan/mengurungkan perintah yang baru ia berikan karena kamu salah/ngawur, gunakan alat undo_last_action. " +
                      "Jika Admin melampirkan file (PDF/Gambar) dan meminta ekstraksi soal, bacalah file tersebut dan JAWABLAH DENGAN BLOK KODE JSON (```json [array objek soal] ```). Setiap soal wajib memiliki field: tipe (pg/pgk), tingkat_kesulitan (Mudah/Sedang/Sulit - HURUF KECIL UNTUK NAMA FIELD `tingkat_kesulitan`), pertanyaan, opsi (array), dan kunci. JANGAN gunakan tool untuk import soal, cukup balas dengan output JSON saja. " +
                      "PENTING (FORMATTING TEKS): Gunakan selalu tag HTML yang valid (seperti `<br>` atau `<p>`) untuk setiap enter/baris baru pada soal, agar teks tidak menyambung saat tampil di web. Kamu juga SANGAT DIANJURKAN menggunakan tag HTML seperti `<ul>`, `<ol>`, `<li>`, `<b>`, `<i>`, atau `<table>` untuk merender bulleting, numbering, tabel, atau teks tebal persis seperti di Microsoft Word. " +

        // =======================================================================
        // 2B. UNDO STATE MANAGEMENT
        // =======================================================================
        let undoStack = [];
        async function saveStateToUndoStack(path, description) {
            try {
                const snap = await db.ref(path).once('value');
                undoStack.push({ path: path, data: snap.val(), description: description });
                if (undoStack.length > 10) undoStack.shift();
            } catch (e) {
                console.error("Failed to save state", e);
            }
        }

        async function handleUndo() {
            if (undoStack.length === 0) {
                Swal.fire("Info", "Tidak ada aksi untuk di-undo (diurungkan).", "info");
                return { error: "Tidak ada aksi untuk di-undo" };
            }
            const lastAction = undoStack.pop();
            try {
                await db.ref(lastAction.path).set(lastAction.data);
                if (lastAction.path.includes('paket_ujian/') || lastAction.path.includes('soal/')) {
                    const parts = lastAction.path.split('/');
                    const id = parts[1];
                    if (id) await compileAndPublishTryout(id);
                }
                Swal.fire("Diurungkan", `Berhasil membatalkan: ${lastAction.description}`, "success");
                return { success: true, message: "Aksi berhasil diurungkan: " + lastAction.description };
            } catch (e) {
                console.error(e);
                return { error: "Gagal melakukan undo: " + e.message };
            }
        }

        // 3. IMPLEMENTASI TOOLS (JS FUNCTIONS)
        // =======================================================================
        async function executeTool(name, args) {
            try {
                if (name === "undo_last_action") {
                    return await handleUndo();
                }
                else if (name === "get_all_tryout") {
                    const snap = await db.ref('paket_ujian').once('value');
                    const data = snap.val() || {};
                    let result = Object.keys(data).map(key => ({
                        id: key, judul: data[key].judul || "-", mapel: data[key].mapel || "(Kosong)",
                        status: data[key].status || "hidden", waktu_buka: data[key].waktu_buka || "-",
                        waktu_tutup: data[key].waktu_tutup || "-", durasi_menit: data[key].durasi_menit || 60
                    }));
                    return result;
                } 
                else if (name === "get_tryout_details") {
                    const snap = await db.ref('paket_ujian/' + args.id).once('value');
                    return snap.val() || { error: "Paket tidak ditemukan." };
                }
                else if (name === "update_tryout") {
                    const { id, updates } = args;
                    if(!id || !updates) return { error: "ID atau updates tidak valid." };
                    
                    const snap = await db.ref('paket_ujian/' + id).once('value');
                    const existingData = snap.val() || {};
                    const isCurrentlyActive = existingData.status === 'aktif';
                    const isActivating = updates.status === 'aktif';
                    
                    if (isCurrentlyActive || isActivating) {
                        let msg = isActivating ? `Agen AI ingin MENGAKTIFKAN tryout ${id}. Ujian akan langsung dapat diakses siswa. Lanjutkan?` : `Tryout ${id} SEDANG AKTIF. Agen AI ingin melakukan perubahan. Lanjutkan?`;

                            title: "AI Membutuhkan Izin", text: msg,

                        });
                        if (!result.isConfirmed) return { error: "Aksi ditolak oleh Admin." };
                    }
                    
                    await saveStateToUndoStack('paket_ujian/' + id, 'Update Tryout ' + id);
                    await db.ref('paket_ujian/' + id).update(updates);
                    await compileAndPublishTryout(id);
                    return { success: true, message: "Berhasil update tryout " + id, updatedData: updates };
                }
                else if (name === "create_tryout") {
                    const id = args.id ? args.id : 'tryout_' + Date.now();

                        status: "hidden", waktu_buat: new Date().toISOString()
                    };

                    if (args.petunjuk) newData.petunjuk = args.petunjuk;
                    await db.ref('paket_ujian/' + id).set(newData);
                    return { success: true, message: "Paket berhasil dibuat.", id: id };

                        icon: "error", showCancelButton: true, confirmButtonText: "Ya, Hapus", confirmButtonColor: "#ef4444"

        async function handleAttachment(e) {
            const files = e.target.files;
            if(!files || files.length === 0) return;
            
            for(let i=0; i<files.length; i++) {
                const file = files[i];
                const base64 = await fileToBase64(file);
                const isImage = file.type.startsWith('image/');
                const isPDF = file.type === 'application/pdf';
                
                let mimeType = file.type;
                if(mimeType === '') { mimeType = 'text/plain'; } // fallback
                
                pendingAttachments.push({ file: file, base64: base64, mimeType: mimeType });
                
                const badge = document.createElement('div');
                badge.className = 'attachment-badge';
                badge.style.display = 'inline-flex';
                badge.style.alignItems = 'center';
                badge.style.gap = '8px';
                
                let previewHtml = '';
                if(isImage) {
                    previewHtml = `<img src="data:${mimeType};base64,${base64}" style="width: 32px; height: 32px; object-fit: cover; border-radius: 4px;">`;
                } else if(isPDF) {
                    previewHtml = `<i class="fa-solid fa-file-pdf" style="font-size: 20px; color: #ef4444;"></i>`;
                } else {
                    previewHtml = `<i class="fa-solid fa-file-lines" style="font-size: 20px; color: #64748b;"></i>`;
                }
                
                badge.innerHTML = `${previewHtml} <div style="max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.8rem;">${file.name}</div>
                                  <span class="remove" onclick="removeAttachment(${pendingAttachments.length - 1}, this)"><i class="fa-solid fa-xmark"></i></span>`;
                document.getElementById('attachment-preview').appendChild(badge);
            }
            document.getElementById('attachment-preview').style.display = 'flex';
            e.target.value = '';
        }

        function removeAttachment(index, btnElement) {

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

            try {
                // Strip heavy base64 data to prevent LocalStorage QuotaExceededError (5MB limit)
                const compactChats = JSON.parse(JSON.stringify(allChats));
                compactChats.forEach(c => {
                    c.history.forEach(msg => {
                        if(msg.parts) {
                            msg.parts.forEach(p => {

                                }
                            });
                        }
                    });
                });
                localStorage.setItem('cbt_agent_chats', JSON.stringify(compactChats));

        }

        // Translasi Format Gemini ke OpenAI Chat Completions
        function translateToolsToOpenAI(geminiTools) {
            if (!geminiTools || !geminiTools[0] || !geminiTools[0].functionDeclarations) return undefined;
            return geminiTools[0].functionDeclarations.map(fn => ({
                type: "function",
                function: {
                    name: fn.name,
                    description: fn.description || "",
                    parameters: fn.parameters || { type: "object", properties: {} }
                }
            }));
        }

        function translateHistoryToOpenAI(geminiHistory, sysInstruction) {
            let messages = [];
            if (sysInstruction && sysInstruction.parts && sysInstruction.parts[0]) {
                messages.push({ role: "system", content: sysInstruction.parts[0].text });
            }
            
            let callIdCounter = 1;
            let pendingToolCalls = {};

            geminiHistory.forEach(msg => {
                const role = msg.role === "model" ? "assistant" : "user";
                let content = "";
                let tool_calls = [];
                let isOnlyToolResponse = true;

                if (msg.parts) {
                    msg.parts.forEach(part => {
                        if (!part.functionResponse) isOnlyToolResponse = false;
                        
                        if (part.text) {
                            if(typeof content === 'string') content += part.text;
                            else content.push({ type: "text", text: part.text });
                        }
                        if (part.inlineData) {
                            if (typeof content === 'string') {
                                content = content ? [{ type: "text", text: content }] : [];
                            }
                            content.push({
                                type: "image_url",
                                image_url: { url: `data:${part.inlineData.mimeType};base64,${part.inlineData.data}` }
                            });
                        }
                        if (part.functionCall) {
                            const callId = "call_" + part.functionCall.name + "_" + callIdCounter++;
                            pendingToolCalls[part.functionCall.name] = callId;
                            tool_calls.push({
                                id: callId,
                                type: "function",
                                function: {
                                    name: part.functionCall.name,
                                    arguments: JSON.stringify(part.functionCall.args || {})
                                }
                            });
                        }
                        if (part.functionResponse) {
                            const callId = pendingToolCalls[part.functionResponse.name] || ("call_" + part.functionResponse.name + "_" + callIdCounter++);
                            messages.push({
                                role: "tool",
                                tool_call_id: callId,
                                name: part.functionResponse.name,
                                content: JSON.stringify(part.functionResponse.response.result)
                            });
                        }
                    });
                }
                
                if (!isOnlyToolResponse) {
                    let msgObj = { role: role };
                    if (content) msgObj.content = content;
                    if (tool_calls.length > 0) msgObj.tool_calls = tool_calls;
                    messages.push(msgObj);
                }
            });
            return messages;
        }

        async function processGeminiCall() {
            // Determine active provider
            const isGroq = false; // Groq logic removed
            const isOpenRouter = ACTUAL_MODEL_RAW.startsWith('openrouter:');
            const isGemini = !isOpenRouter;
            
            const modelName = isOpenRouter ? ACTUAL_MODEL_RAW.replace('openrouter:', '') : ACTUAL_MODEL_RAW;

            const apiKey = isOpenRouter ? localStorage.getItem('cbt_openrouter_key') : localStorage.getItem('cbt_gemini_key');

            if(!apiKey) {
                appendMessage('ai', 'API Key belum dikonfigurasi. Silakan masuk ke menu <b>Pengaturan Akun Admin</b> untuk mengatur API Key untuk provider ini.');
                removeLoading(); return;
            }
            showLoading();

            try {
                // CONTEXT WINDOW: Batasi ke 30 pesan terakhir agar token tidak bengkak
                let limitedHistory = JSON.parse(JSON.stringify(chatHistory.length > 30 ? chatHistory.slice(chatHistory.length - 30) : chatHistory));
                // Remove base64 omitted string so API won't crash
                limitedHistory.forEach(msg => {
                    if (msg.parts) {
                        msg.parts = msg.parts.filter(p => !(p.inlineData && p.inlineData.data === "[base64_omitted]"));
                    }
                });
                // Clean up empty parts just in case
                limitedHistory = limitedHistory.filter(msg => msg.parts && msg.parts.length > 0);

                let data;

                if (isGemini) {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            systemInstruction: systemInstruction,
                            contents: limitedHistory,
                            tools: toolsConfig,
                            generationConfig: { temperature: 0.2 }
                        })
                    });
                    data = await response.json();
                } else {
                    const endpoint = 'https://openrouter.ai/api/v1/chat/completions';
                    
                    const messages = translateHistoryToOpenAI(limitedHistory, systemInstruction);
                    const openAITools = translateToolsToOpenAI(toolsConfig);
                    
                    const reqBody = {
                        model: modelName,
                        messages: messages,
                        temperature: 0.2
                    };
                    
                    if (openAITools && openAITools.length > 0) {
                        reqBody.tools = openAITools;
                        reqBody.tool_choice = "auto";
                    }
                    
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`,
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'CBT LBB Admin'
                    };

                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(reqBody)
                    });
                    
                    const openAIData = await response.json();
                    
                    if (openAIData.error) {
                        data = { error: openAIData.error };
                    } else {
                        // Translate OpenAI response to Gemini format
                        const choice = openAIData.choices[0].message;
                        let geminiParts = [];
                        
                        if (choice.content) {
                            geminiParts.push({ text: choice.content });
                        }
                        
                        if (choice.tool_calls && choice.tool_calls.length > 0) {
                            choice.tool_calls.forEach(tc => {
                                if (tc.type === 'function') {
                                    let args = {};
                                    try { args = JSON.parse(tc.function.arguments); } catch(e) {}
                                    geminiParts.push({
                                        functionCall: {
                                            name: tc.function.name,
                                            args: args
                                        }
                                    });
                                }
                            });
                        }
                        
                        data = {
                            candidates: [{
                                content: {
                                    role: "model",
                                    parts: geminiParts
                                }
                            }]
                        };
                    }
                }

                removeLoading();

                if (data.error) { appendMessage('ai', 'Error dari server: ' + (data.error.message || JSON.stringify(data.error))); return; }
                if (!data.candidates || data.candidates.length === 0) { appendMessage('ai', 'Tidak ada respons dari AI.'); return; }

                const responseMessage = data.candidates[0].content;
                const parts = responseMessage.parts;
                
                chatHistory.push(responseMessage);
                saveCurrentChat();

                let isFunctionCall = false;
                let textToDisplay = "";
                const hasFunctionCalls = parts.some(p => p.functionCall);
                const groupThinkId = 'think-group-' + Date.now() + Math.floor(Math.random() * 1000);
                
                if (hasFunctionCalls) {
                    appendMessage('ai', `
                        <details class="think-block" id="${groupThinkId}" open>
                            <summary><i class="fa-solid fa-gears fa-spin" style="color: #3b82f6;"></i> <span id="title-${groupThinkId}">Mengeksekusi alat...</span></summary>
                            <div id="content-${groupThinkId}" style="display:flex; flex-direction:column; gap:12px;"></div>
                        </details>`);
                }

                let functionResponsesBatch = [];
                for (const part of parts) {
                    if (part.text) { textToDisplay += part.text + "\n"; }
                    if (part.functionCall) {
                        isFunctionCall = true;
                        const fnName = part.functionCall.name;
                        const fnArgs = part.functionCall.args;
                        
                        const contentDiv = document.getElementById('content-' + groupThinkId);
                        if (contentDiv) {
                            contentDiv.innerHTML += `<div><div style="font-weight: 700; color: #475569; margin-bottom: 4px;"><i class="fa-solid fa-bolt" style="color: #f59e0b; margin-right: 5px;"></i>${fnName}</div><div style="color: #94a3b8; font-size: 0.8rem; line-height: 1.4;">${JSON.stringify(fnArgs, null, 2)}</div></div>`;
                        }

                        const result = await executeTool(fnName, fnArgs);
                        functionResponsesBatch.push({ functionResponse: { name: fnName, response: { result: result } } });
                    }
                }

                if (functionResponsesBatch.length > 0) {
                    chatHistory.push({
                        role: 'user',
                        parts: functionResponsesBatch
                    });
                    saveCurrentChat();
                }

                if (hasFunctionCalls) {
                    const groupThinkEl = document.getElementById(groupThinkId);
                    if (groupThinkEl) {
                        groupThinkEl.removeAttribute('open');
                        const icon = groupThinkEl.querySelector('summary i');
                        if (icon) { icon.classList.remove('fa-spin', 'fa-gears'); icon.classList.add('fa-check-circle'); icon.style.color = 'var(--success)'; }
                        const title = document.getElementById('title-' + groupThinkId);
                        if (title) title.innerText = "Selesai eksekusi";
                    }
                }

                if (textToDisplay.trim() !== "") {
                    let jsonStr = extractJSON(textToDisplay);
                    if(jsonStr) {
                        let cleanText = textToDisplay.replace(jsonStr, '').replace(/```json|```/g, '').trim();
                        if(!cleanText) cleanText = 'Ekstraksi soal berhasil!';
                        
                        let randomId = 'temp-json-' + Math.random().toString(36).substring(7);
                        let ui = `<div style="display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center; background: #eff6ff; padding: 20px; border-radius: 12px; border: 1px solid #bfdbfe; margin-top: 15px;">
                            <i class="fa-solid fa-circle-check" style="font-size:3rem; color:#10b981;"></i>
                            <div style="font-weight:600; color:#065f46; font-size:1.05rem;">${cleanText}</div>
                            <div style="font-size:0.85rem; color:#4b5563; margin-bottom:5px;">Ditemukan soal beserta format jawaban yang siap disimpan.</div>
                            <textarea id="${randomId}" style="display:none;">${jsonStr.replace(/</g, '&lt;')}</textarea>
                            <button class="btn btn-primary" onclick="terapkanJSONAgen(document.getElementById('${randomId}').value)" style="font-size: 0.9rem; padding: 10px 16px; width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(16,185,129,0.3); background: #10b981; border:none; transition:0.2s;"><i class="fa-solid fa-check-double"></i> Terapkan ke Tryout</button>
                        </div>`;
                        appendMessage('ai', ui);
                    } else {
                        let formatted = textToDisplay.replace(/<think>([\s\S]*?)<\/think>/gi, (match, p1) => {
                            return `<details class="think-block"><summary><i class="fa-solid fa-lightbulb" style="color:#f59e0b;"></i> Pemikiran Agent</summary><div>${p1.trim()}</div></details>`;
                        });
                        formatted = marked.parse(formatted);
                        appendMessage('ai', formatted);
                    }
                }

                if (isFunctionCall) { await processGeminiCall(); }

            } catch (err) {
                removeLoading(); appendMessage('ai', 'Gagal menghubungi server AI: ' + err.message); console.error(err);
            }
        }

        function extractJSON(str) {
            let match = str.match(/\[\s*\{[\s\S]*\}\s*\]/);
            if(!match) {
                const start = str.indexOf('[');
                const end = str.lastIndexOf(']');
                if(start !== -1 && end !== -1 && end > start) {
                    match = [str.substring(start, end + 1)];
                }
            }
            if(match) {
                try {
                    let parsed = JSON.parse(match[0]);
                    if(Array.isArray(parsed) && parsed.length > 0 && parsed[0].pertanyaan) {
                        return match[0];
                    }
                } catch(e) {}
            }
            return null;
        }

        async function terapkanJSONAgen(jsonStr) {
            try {
                const soalArray = JSON.parse(jsonStr);
                
                const snap = await db.ref('paket_ujian').once('value');
                const data = snap.val() || {};
                const options = {};
                Object.keys(data).forEach(k => {
                    options[k] = data[k].judul || k;
                });
                
                if(Object.keys(options).length === 0) {
                    Swal.fire('Error', 'Belum ada paket tryout. Buat paket dulu.', 'error');
                    return;
                }
                
                const { value: id_paket } = await Swal.fire({
                    title: 'Pilih Tryout Tujuan',
                    text: `Ditemukan ${soalArray.length} soal. Ke paket mana soal ini akan dimasukkan?`,
                    input: 'select',
                    inputOptions: options,
                    inputPlaceholder: 'Pilih Paket Tryout',
                    showCancelButton: true,
                    confirmButtonText: 'Simpan',
                    cancelButtonText: 'Batal'
                });
                
                if (id_paket) {
                    Swal.fire({title: 'Menyimpan...', allowOutsideClick: false, didOpen: () => { Swal.showLoading() }});
                    const ref = db.ref('soal/' + id_paket);
                    
                    const existSnap = await ref.once('value');
                    let existSoal = existSnap.val() || [];
                    if(!Array.isArray(existSoal)) existSoal = Object.values(existSoal);
                    
                    if (existSoal.length === 1 && existSoal[0].pertanyaan && existSoal[0].pertanyaan.includes("Soal kosong, silakan edit")) {
                        existSoal = [];
                    }
                    
                    let mergedSoal = existSoal.concat(soalArray);
                    mergedSoal.forEach((s, idx) => s.id_soal = idx + 1);
                    
                    await ref.set(mergedSoal);
                    await compileAndPublishTryout(id_paket);
                    
                    Swal.fire('Sukses', `Berhasil menambahkan ${soalArray.length} soal ke paket ${options[id_paket]}.`, 'success');
                    
                    appendMessage('ai', `✅ Berhasil mengimpor ${soalArray.length} soal ke paket **${options[id_paket]}**.`);
                    chatHistory.push({ role: 'model', parts: [{ text: `Berhasil mengimpor ${soalArray.length} soal ke paket ${id_paket}.` }] });
                    saveCurrentChat();
                }
            } catch (err) {
                Swal.fire('Error', 'Gagal memproses JSON: ' + err.message, 'error');
            }
        }

        async function compileAndPublishTryout(id_paket) {
            try {
                const snapPaket = await db.ref('paket_ujian/' + id_paket).once('value');
                const p = snapPaket.val();
                if(!p) return;
                
                const snapSoal = await db.ref('soal/' + id_paket).once('value');
                const s = snapSoal.val() || [];

                if (s.length > 0 && p.status === 'aktif') {
                    let compiledSoal = s.map(soal => {
                        let bobot = 1; 
                        if(p.sistem_poin !== false && p.kategori_poin && p.kategori_poin[soal.tingkat_kesulitan]) {
                            bobot = p.kategori_poin[soal.tingkat_kesulitan];
                        }
                        
                        let stimObj = { tampil: false };
                        if(soal.id_stimulus && p.bank_stimulus && p.bank_stimulus[soal.id_stimulus]) {
                            stimObj = { tampil: true, konten: p.bank_stimulus[soal.id_stimulus] };
                        }

                        return {
                            id: soal.id_soal || 's_' + Math.random().toString(36).substr(2, 9),
                            tipe: soal.tipe || 'pg',
                            poin: bobot,
                            stimulus: stimObj,
                            pertanyaan: soal.pertanyaan || '',
                            opsi: Array.isArray(soal.opsi) ? soal.opsi : [],
                            kunci: soal.kunci,
                            label_pgk: soal.label_pgk || ["Benar", "Salah"], 
                            ragu: false 
                        };
                    });

                    let publishedData = {
                        id: id_paket,
                        judul: p.judul || "",
                        mapel: p.mapel || "",
                        waktu: p.durasi_menit || 60,
                        waktu_buka: p.waktu_buka || "",
                        waktu_tutup: p.waktu_tutup || "",
                        sistem_poin: p.sistem_poin !== false,
                        mode_skor: p.mode_skor || "asli",
                        base_poin: p.base_poin || 100,
                        url_pembahasan: p.url_pembahasan || "", 
                        petunjuk: p.petunjuk || [],
                        soal: compiledSoal
                    };

                    await db.ref('published_soal/' + id_paket).set(publishedData);
                } else {
                    await db.ref('published_soal/' + id_paket).set(null);
                }
            } catch (e) {
                console.error("Gagal compile published_soal", e);
            }
        }
</script>
