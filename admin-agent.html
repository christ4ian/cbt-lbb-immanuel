<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Agent | LBB CBT Admin</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <style>
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8; --danger: #ef4444; --success: #10b981; --warning: #f59e0b;
            --bg-main: #f1f5f9; --text-dark: #0f172a; --text-muted: #64748b; --border: #e2e8f0;
            --radius: 12px; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; outline: none; }
        body { background-color: var(--bg-main); color: var(--text-dark); display: flex; height: 100vh; overflow: hidden; }
        a, button, .card { transition: all 0.2s ease; }

        /* LAYOUT UTAMA */
        .sidebar { width: 260px; background: white; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px 0; z-index: 100; box-shadow: var(--shadow); }
        .main-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; padding-bottom: 0; scroll-behavior: smooth;}
        
        .brand { padding: 0 20px 20px 20px; font-size: 1.3rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); margin-bottom: 15px;}
        .nav-item { padding: 12px 20px; margin: 4px 15px; border-radius: 8px; color: var(--text-muted); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none;}
        .nav-item:hover { background: #f8fafc; color: var(--primary); transform: translateX(5px); }
        .nav-item.active { background: #eff6ff; color: var(--primary); }

        .top-navbar { background: white; padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 90; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .container { padding: 25px; max-width: 1500px; margin: 0 auto; width: 100%; flex: 1; display: flex; flex-direction: column; height: calc(100vh - 65px); }

        /* MOBILE BOTTOM NAV */
        .bottom-nav { display: none; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { padding-bottom: 80px; } 
            .container { height: calc(100vh - 65px - 80px); padding: 15px; }
            .bottom-nav { display: flex; position: fixed; bottom: 0; left: 0; width: 100%; background: white; border-top: 1px solid var(--border); z-index: 1000; box-shadow: 0 -4px 15px rgba(0,0,0,0.05); padding-bottom: env(safe-area-inset-bottom); }
            .bottom-nav-item { flex: 1; text-align: center; padding: 12px 5px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none;}
            .bottom-nav-item i { font-size: 1.3rem; margin-bottom: 2px;}
            .bottom-nav-item.active { color: var(--primary); }
        }

        /* KOMPONEN UI */
        .btn { padding: 10px 16px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: 1px solid transparent; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 2px 4px rgba(37,99,235,0.2); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 4px 6px rgba(37,99,235,0.3); }
        
        .form-control { width: 100%; padding: 12px 14px; border: 2px solid var(--border); border-radius: 8px; font-size: 0.95rem; background: #f8fafc; transition: 0.2s; }
        .form-control:focus { background: white; border-color: var(--primary); }

        /* CHAT UI */
        .chat-wrapper { background: white; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .chat-header { background: white; color: var(--text-dark); padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; font-weight: 700; font-size: 1.1rem; border-bottom: 1px solid var(--border); }
        .chat-messages { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; background: white; scroll-behavior: smooth; }
        
        .msg-bubble { max-width: 85%; padding: 12px 18px; font-size: 0.95rem; line-height: 1.6; position: relative; }
        .msg-bubble p:first-child { margin-top: 0; }
        .msg-bubble p:last-child { margin-bottom: 0; }
        
        /* Gemini Style Bubbles */
        .msg-user { background: #f0f4f9; color: #1f1f1f; align-self: flex-end; border-radius: 20px; box-shadow: none; border: none; padding: 12px 20px; }
        .msg-ai { background: transparent; color: var(--text-dark); align-self: flex-start; border-radius: 0; box-shadow: none; border: none; padding: 5px 10px; display: flex; gap: 15px; flex-direction: column; width: 100%; max-width: 95%; }
        
        /* Markdown Table CSS */
        .msg-ai table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 0.9rem; }
        .msg-ai th, .msg-ai td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
        .msg-ai th { background: #f8fafc; font-weight: 700; color: var(--text-dark); }
        .msg-ai tr:nth-child(even) { background-color: #f8fafc; }
        
        /* THINKING BLOCK (Details/Summary) */
        details.think-block { background: transparent; margin-bottom: 15px; }
        details.think-block summary { cursor: pointer; font-weight: 600; color: #64748b; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; user-select: none; padding: 6px 16px; border-radius: 20px; transition: 0.2s; background: #f1f5f9; }
        details.think-block summary:hover { background: #e2e8f0; }
        details.think-block summary::-webkit-details-marker { display: none; }
        details.think-block > div { padding: 12px 15px 12px 20px; border-left: 2px solid #cbd5e1; margin-left: 15px; margin-top: 10px; font-family: 'Consolas', monospace; font-size: 0.85rem; color: #64748b; white-space: pre-wrap; word-break: break-word; }
        
        .chat-input-area { padding: 15px 25px; background: white; display: flex; gap: 15px; align-items: center; }
        .chat-input { flex: 1; border: 1px solid #d1d5db; border-radius: 24px; padding: 15px 20px; font-size: 1rem; background: #f8fafc; resize: none; overflow: hidden; min-height: 52px; max-height: 150px; font-family: 'Inter', sans-serif;}
        .chat-input:focus { background: white; border-color: var(--primary); outline: none; box-shadow: 0 0 0 2px rgba(37,99,235,0.1); }
        .btn-send { background: #1a73e8; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; transition: 0.2s; flex-shrink: 0;}
        .btn-send:hover { transform: scale(1.05); background: #1765cc; }
        .btn-send:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; transform: none; }

        .typing-indicator { display: inline-flex; align-items: center; gap: 5px; padding: 10px 15px; background: transparent; align-self: flex-start; margin-bottom: 15px; margin-left: 10px;}
        .dot { width: 8px; height: 8px; background: #1a73e8; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
        
        pre { background: #f0f4f9; color: #1f1f1f; padding: 15px; border-radius: 8px; overflow-x: auto; margin: 10px 0; font-size: 0.85rem; border: 1px solid #e5e7eb; }
        code { font-family: 'Consolas', monospace; }
        .msg-ai p code { background: #f0f4f9; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; border: 1px solid #e5e7eb;}

    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand"><i class="fa-solid fa-layer-group"></i> Master Admin</div>
        <a href="admin-tryout.html" class="nav-item"><i class="fa-solid fa-folder-open"></i> Manajemen Try Out</a>
        <a href="admin-database.html" class="nav-item"><i class="fa-solid fa-users"></i> Data Siswa & Nilai</a>
        <a href="admin-stat.html" class="nav-item"><i class="fa-solid fa-chart-line"></i> Statistik & Peringkat</a>
        <a href="admin-agent.html" class="nav-item active"><i class="fa-solid fa-robot"></i> AI Agent</a>
        <div style="flex: 1;"></div>
        
        <a href="admin-settings.html" class="nav-item"><i class="fa-solid fa-user-gear"></i> Pengaturan Akun Admin</a>
        
        <div class="nav-item" style="color: var(--danger); cursor: pointer;" onclick="auth.signOut()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Keluar Sistem</div>
    </aside>

    <main class="main-content">
        <nav class="top-navbar">
            <div style="font-weight: 800; color: var(--text-dark); font-size: 1.1rem;">CBT AI Agent Workspace</div>
        </nav>

        <div class="container">
            <div class="chat-wrapper">
                <div class="chat-header">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <i class="fa-solid fa-sparkles" style="color: #1a73e8; font-size: 1.4rem;"></i> 
                        <div>
                            <div style="font-size: 1.1rem; margin-bottom: 2px;">CBT AI Agent</div>
                            <div style="font-size: 0.75rem; font-weight: 500; color: #64748b;">Powered by Gemini</div>
                        </div>
                    </div>
                    <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem; border-color: var(--danger); color: var(--danger);" onclick="clearChat()">
                        <i class="fa-solid fa-trash-can"></i> Bersihkan Obrolan
                    </button>
                </div>
                
                <div class="chat-messages" id="chat-messages">
                    <!-- Default Greeting Will Be Loaded by JS if empty -->
                </div>

                <div class="chat-input-area">
                    <textarea id="chat-input" class="chat-input" placeholder="Tuliskan perintah atau pertanyaan Anda di sini..." rows="1" oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                    <button class="btn-send" id="btn-send" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="admin-tryout.html" class="bottom-nav-item"><i class="fa-solid fa-folder-open"></i> Try Out</a>
        <a href="admin-database.html" class="bottom-nav-item"><i class="fa-solid fa-users"></i> Siswa</a>
        <a href="admin-stat.html" class="bottom-nav-item"><i class="fa-solid fa-chart-line"></i> Statistik</a>
        <a href="admin-agent.html" class="bottom-nav-item active"><i class="fa-solid fa-robot"></i> AI Agent</a>
    </nav>

    <script>
        // =======================================================================
        // 1. INISIALISASI FIREBASE
        // =======================================================================
        const firebaseConfig = { apiKey: "AIzaSyC04h_Aaz9I9WncNeEWc8A5cEKajmIEDVs", authDomain: "cbt-lbb-immanuel.firebaseapp.com", databaseURL: "https://cbt-lbb-immanuel-default-rtdb.firebaseio.com", projectId: "cbt-lbb-immanuel", storageBucket: "cbt-lbb-immanuel.firebasestorage.app" };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();

        auth.onAuthStateChanged(user => { if (!user) window.location.replace('login-admin.html'); });

        // =======================================================================
        // 2. GEMINI API SETUP
        // =======================================================================
        // Menggunakan flash-latest karena lebih mendukung function calling dengan baik daripada flash-lite yang mungkin fiturnya dipangkas, tapi kita ikuti instruksi
        const GEMINI_MODEL = "gemini-1.5-flash-latest"; // fallback ke standar terbaru jika 3.1 belum ready rest apinya.
        const ACTUAL_MODEL = "gemini-3.1-flash-lite";

        let chatHistory = [];
        
        // System instruction
        const systemInstruction = {
            parts: [{
                text: "Kamu adalah CBT AI Agent, asisten super cerdas untuk Master Admin dari sistem Computer Based Test. " +
                      "Tugasmu adalah membantu mengelola data ujian dan melihat statistik siswa. " +
                      "Gunakan fungsi (tools) yang disediakan untuk membaca data dari database atau melakukan update. " +
                      "Selalu jelaskan apa yang akan kamu lakukan atau apa hasil pemikirannya ke dalam pesanmu sebelum memberikan jawaban akhir. " +
                      "Kamu dapat mengeksekusi multi-tool calls jika perlu. Jika pengguna meminta untuk 'mengubah ujian tryout mei', kamu harus mencari id tryout mei menggunakan get_all_tryout, lalu memanggil update_tryout. " +
                      "Untuk menambah atau menghapus siswa, kamu HARUS menggunakan tool add_siswa atau delete_siswa. Jangan pernah berasumsi aksi ini akan jalan tanpa persetujuan Admin karena sistem otomatis akan memunculkan prompt ke Admin. " +
                      "Jawab dalam bahasa Indonesia yang ramah, profesional, dan gunakan pemformatan Markdown (bold, tabel, list) agar rapi."
            }]
        };

        const toolsConfig = [{
            functionDeclarations: [
                {
                    name: "get_all_tryout",
                    description: "Mengambil daftar semua tryout / paket ujian beserta id, judul, status, waktu buka, waktu tutup, dan durasi."
                },
                {
                    name: "get_tryout_details",
                    description: "Mengambil semua rincian tentang suatu paket tryout spesifik.",
                    parameters: {
                        type: "OBJECT",
                        properties: { id: { type: "STRING", description: "ID dari paket tryout" } },
                        required: ["id"]
                    }
                },
                {
                    name: "update_tryout",
                    description: "Melakukan update/perubahan pengaturan pada suatu paket tryout. Bisa mengubah status, waktu buka, waktu tutup, judul, dll.",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            id: { type: "STRING", description: "ID paket ujian yang akan diubah" },
                            updates: {
                                type: "OBJECT",
                                properties: {
                                    status: { type: "STRING", description: "aktif atau hidden" },
                                    waktu_buka: { type: "STRING", description: "Waktu buka dengan format YYYY-MM-DD HH:mm:ss" },
                                    waktu_tutup: { type: "STRING", description: "Waktu tutup dengan format YYYY-MM-DD HH:mm:ss" },
                                    judul: { type: "STRING", description: "Judul tryout" },
                                    durasi_menit: { type: "INTEGER", description: "Durasi ujian dalam menit" },
                                    mapel: { type: "STRING", description: "Mata Pelajaran dari tryout (contoh: Matematika, IPA, dsb)" },
                                    sistem_poin: { type: "BOOLEAN", description: "Mengatur apakah soal menggunakan sistem poin berdasarkan tingkat kesulitan (true/false)." },
                                    petunjuk: { type: "ARRAY", items: { type: "STRING" }, description: "Daftar petunjuk atau aturan ujian per poin. Mendukung tag HTML sederhana." }
                                }
                            }
                        },
                        required: ["id", "updates"]
                    }
                },
                {
                    name: "get_siswa_stats",
                    description: "Mengambil daftar ringkasan statistik siswa (cheat count, skor akhir, durasi pengerjaan, paket yang dikerjakan) dari seluruh sesi ujian."
                },
                {
                    name: "get_all_siswa_pendaftaran",
                    description: "Mengambil daftar seluruh siswa yang sudah terdaftar di suatu paket tryout tertentu.",
                    parameters: { type: "OBJECT", properties: { id_paket: { type: "STRING" } }, required: ["id_paket"] }
                },
                {
                    name: "add_siswa",
                    description: "Menambahkan pendaftaran siswa baru secara manual ke sebuah paket tryout. (Aksi ini membutuhkan persetujuan/konfirmasi dari Admin).",
                    parameters: { 
                        type: "OBJECT", 
                        properties: { 
                            id_paket: { type: "STRING", description: "ID dari paket tryout" }, 
                            nama_siswa: { type: "STRING", description: "Nama lengkap siswa" }, 
                            email: { type: "STRING", description: "Email valid siswa" }, 
                            sekolah: { type: "STRING", description: "Asal sekolah (opsional)" } 
                        }, 
                        required: ["id_paket", "nama_siswa", "email"] 
                    }
                },
                {
                    name: "delete_siswa",
                    description: "Menghapus pendaftaran siswa secara permanen dari sebuah paket tryout beserta riwayat ujiannya. (Aksi ini membutuhkan persetujuan Admin).",
                    parameters: { 
                        type: "OBJECT", 
                        properties: { 
                            id_paket: { type: "STRING", description: "ID dari paket tryout" }, 
                            email: { type: "STRING", description: "Email siswa yang akan dihapus" } 
                        }, 
                        required: ["id_paket", "email"] 
                    }
                }
            ]
        }];

        // =======================================================================
        // 3. IMPLEMENTASI TOOLS (JS FUNCTIONS)
        // =======================================================================
        async function executeTool(name, args) {
            try {
                if (name === "get_all_tryout") {
                    const snap = await db.ref('paket_ujian').once('value');
                    const data = snap.val() || {};
                    let result = Object.keys(data).map(key => ({
                        id: key,
                        judul: data[key].judul || "-",
                        mapel: data[key].mapel || "(Kosong)",
                        status: data[key].status || "hidden",
                        waktu_buka: data[key].waktu_buka || "-",
                        waktu_tutup: data[key].waktu_tutup || "-",
                        durasi_menit: data[key].durasi_menit || 60
                    }));
                    return result;
                } 
                else if (name === "get_tryout_details") {
                    const snap = await db.ref('paket_ujian/' + args.id).once('value');
                    return snap.val() || { error: "Paket tidak ditemukan." };
                }
                else if (name === "update_tryout") {
                    const { id, updates } = args;
                    if(!id || !updates) return { error: "ID atau updates tidak valid." };
                    await db.ref('paket_ujian/' + id).update(updates);
                    // Jika status berubah, kita mungkin perlu update published_soal (tapi abaikan dulu, biarkan admin update manual dr editor nanti atau asumsi ini update config dasar)
                    return { success: true, message: "Berhasil update tryout " + id, updatedData: updates };
                }
                else if (name === "get_siswa_stats") {
                    const snapSesi = await db.ref('sessions').once('value');
                    const sesiData = snapSesi.val() || {};
                    let result = [];
                    Object.keys(sesiData).forEach(k => {
                        let s = sesiData[k];
                        if (s.status === 'finished') {
                            result.push({
                                nama: s.userData?.nama || "Anonim",
                                email: s.userData?.email || "-",
                                paketId: s.paketId,
                                cheatCount: s.cheatCount || 0,
                                skor_akhir: s.skor_akhir || 0,
                                waktu_mulai: s.startTime ? new Date(s.startTime).toISOString() : null,
                                waktu_selesai: s.finishTime ? new Date(s.finishTime).toISOString() : null
                            });
                        }
                    });
                    return result;
                }
                else if (name === "get_all_siswa_pendaftaran") {
                    const snap = await db.ref('pendaftaran').orderByChild('id_paket').equalTo(args.id_paket).once('value');
                    if(!snap.exists()) return { error: "Belum ada siswa yang mendaftar di paket ini." };
                    let list = [];
                    snap.forEach(c => { list.push(c.val()); });
                    return list;
                }
                else if (name === "add_siswa") {
                    const result = await Swal.fire({
                        title: "AI Membutuhkan Izin",
                        text: `Agen AI ingin MENAMBAHKAN siswa bernama ${args.nama_siswa} (${args.email}) ke paket ${args.id_paket}. Izinkan aksi ini?`,
                        icon: "warning", showCancelButton: true, confirmButtonText: "Izinkan", cancelButtonText: "Tolak", confirmButtonColor: "#10b981"
                    });
                    if (!result.isConfirmed) return { error: "Aksi ditolak oleh Admin. Laporkan ke user bahwa admin tidak memberi izin." };
                    
                    const idAman = args.email.replace(/[^a-zA-Z0-9]/g, '_'); 
                    const customId = `${args.id_paket}_${idAman}`;
                    await db.ref('pendaftaran/' + customId).set({
                        id_paket: args.id_paket,
                        nama_siswa: args.nama_siswa,
                        email: args.email,
                        sekolah: args.sekolah || "-",
                        waktu_daftar: new Date().toISOString()
                    });
                    return { success: true, message: `Siswa ${args.nama_siswa} berhasil ditambahkan.` };
                }
                else if (name === "delete_siswa") {
                    const result = await Swal.fire({
                        title: "AI Membutuhkan Izin",
                        text: `Agen AI ingin MENGHAPUS pendaftaran siswa dengan email ${args.email} dari paket ${args.id_paket}. Tindakan ini tidak dapat dikembalikan. Izinkan?`,
                        icon: "error", showCancelButton: true, confirmButtonText: "Ya, Hapus", cancelButtonText: "Tolak", confirmButtonColor: "#ef4444"
                    });
                    if (!result.isConfirmed) return { error: "Aksi ditolak oleh Admin. Laporkan ke user bahwa admin tidak memberi izin." };
                    
                    const idAman = args.email.replace(/[^a-zA-Z0-9]/g, '_'); 
                    const customId = `${args.id_paket}_${idAman}`;
                    await db.ref('pendaftaran/' + customId).remove();
                    
                    const tempSessionId = args.id_paket + "_" + args.email.replace(/\./g, '_');
                    await db.ref('sessions/' + tempSessionId).remove();
                    
                    return { success: true, message: `Siswa dengan email ${args.email} berhasil dihapus dari paket ${args.id_paket}.` };
                }
                return { error: "Fungsi tidak dikenali." };
            } catch (err) {
                return { error: err.message };
            }
        }

        // =======================================================================
        // 4. UI CHAT HANDLER
        // =======================================================================
        const chatBox = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const btnSend = document.getElementById('btn-send');

        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                handleSend();
            }
        });

        function appendMessage(role, htmlContent, id = null) {
            const div = document.createElement('div');
            div.className = 'msg-bubble ' + (role === 'user' ? 'msg-user' : 'msg-ai');
            if (id) div.id = id;

            // Gemini style wrapper for AI messages
            if (role === 'ai') {
                div.innerHTML = `
                    <div style="display:flex; gap: 15px; align-items: flex-start; width: 100%;">
                        <i class="fa-solid fa-sparkles" style="color: #1a73e8; font-size: 1.2rem; margin-top: 2px;"></i>
                        <div style="flex: 1; width: 100%; overflow: hidden;">${htmlContent}</div>
                    </div>
                `;
            } else {
                div.innerHTML = htmlContent;
            }

            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div; // Return element so we can update it (e.g. thinking indicator)
        }

        // --- LOCAL STORAGE HANDLING ---
        function saveChat() {
            localStorage.setItem('cbt_agent_history', JSON.stringify(chatHistory));
        }

        function clearChat() {
            Swal.fire({
                title: 'Hapus Riwayat?',
                text: "Riwayat obrolan AI ini akan dibersihkan.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Ya, Bersihkan!'
            }).then((result) => {
                if (result.isConfirmed) {
                    localStorage.removeItem('cbt_agent_history');
                    chatHistory = [];
                    chatBox.innerHTML = '';
                    appendDefaultGreeting();
                }
            });
        }

        function appendDefaultGreeting() {
            appendMessage('ai', `<b>Halo, Master Admin!</b> 👋<br>
                Saya adalah AI Agent yang bertugas membantu Anda mengelola sistem CBT ini. 
                Saya bisa membantu Anda melakukan berbagai hal, seperti:
                <ul style="margin-top: 10px; margin-left: 20px;">
                    <li>Melakukan <b>bulk setting</b> (misal: "ubah semua ujian bulan Mei menjadi aktif").</li>
                    <li>Memberikan <b>insight data</b> (misal: "siapa siswa dengan jumlah kecurangan terbanyak?").</li>
                    <li>Menjelaskan detail spesifik dari suatu paket ujian.</li>
                </ul>
                Apa yang bisa saya bantu hari ini?`);
        }

        function loadChat() {
            const saved = localStorage.getItem('cbt_agent_history');
            if (saved) {
                try {
                    chatHistory = JSON.parse(saved);
                    // Re-render bubbles
                    chatHistory.forEach(msg => {
                        if (msg.role === 'user') {
                            if (msg.parts && msg.parts[0] && msg.parts[0].text) {
                                appendMessage('user', msg.parts[0].text.replace(/\n/g, '<br>'));
                            }
                        } else if (msg.role === 'model') {
                            if (msg.parts) {
                                let combinedText = "";
                                msg.parts.forEach(p => {
                                    if (p.text) combinedText += p.text + "\\n";
                                });
                                if (combinedText.trim() !== "") {
                                    appendMessage('ai', marked.parse(combinedText));
                                }
                            }
                        }
                    });
                } catch (e) {
                    console.error("Gagal load history", e);
                    appendDefaultGreeting();
                }
            } else {
                appendDefaultGreeting();
            }
        }

        // Jalankan saat load
        window.addEventListener('DOMContentLoaded', loadChat);

        function showLoading() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'loading-indicator';
            div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const el = document.getElementById('loading-indicator');
            if(el) el.remove();
        }

        async function handleSend() {
            const text = chatInput.value.trim();
            if (!text) return;

            chatInput.value = '';
            chatInput.style.height = '';
            btnSend.disabled = true;
            chatInput.disabled = true;

            appendMessage('user', text.replace(/\n/g, '<br>'));
            chatHistory.push({ role: 'user', parts: [{ text }] });
            saveChat();

            await processGeminiCall();

            btnSend.disabled = false;
            chatInput.disabled = false;
            chatInput.focus();
            saveChat(); // Save final state after process
        }

        // Fungsi pemrosesan loop (karena agent mungkin manggil fungsi lebih dari 1 kali sebelum jawab final)
        async function processGeminiCall() {
            const currentApiKey = localStorage.getItem('cbt_gemini_key') || "";
            if(!currentApiKey) {
                appendMessage('ai', 'API Key belum dikonfigurasi. Silakan masuk ke menu <b>Pengaturan Akun Admin</b> untuk mengatur Gemini API Key.');
                removeLoading();
                return;
            }

            showLoading();

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${ACTUAL_MODEL}:generateContent?key=${currentApiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        systemInstruction: systemInstruction,
                        contents: chatHistory,
                        tools: toolsConfig,
                        generationConfig: { temperature: 0.2 }
                    })
                });

                const data = await response.json();
                removeLoading();

                if (data.error) {
                    appendMessage('ai', 'Error dari server: ' + data.error.message);
                    return;
                }

                if (!data.candidates || data.candidates.length === 0) {
                    appendMessage('ai', 'Tidak ada respons dari AI.');
                    return;
                }

                const responseMessage = data.candidates[0].content;
                const parts = responseMessage.parts;
                
                // Add AI's raw response to history
                chatHistory.push(responseMessage);
                saveChat();

                let isFunctionCall = false;
                let textToDisplay = "";

                // Cek jika ada call tool
                const hasFunctionCalls = parts.some(p => p.functionCall);
                const groupThinkId = 'think-group-' + Date.now() + Math.floor(Math.random() * 1000);
                
                if (hasFunctionCalls) {
                    appendMessage('ai', `
                        <details class="think-block" id="${groupThinkId}" open>
                            <summary><i class="fa-solid fa-gears fa-spin" style="color: #3b82f6;"></i> <span id="title-${groupThinkId}">Mengeksekusi alat...</span></summary>
                            <div id="content-${groupThinkId}" style="display:flex; flex-direction:column; gap:12px;"></div>
                        </details>
                    `);
                }

                // Process parts (could be mixed text and function calls)
                for (const part of parts) {
                    if (part.text) {
                        textToDisplay += part.text + "\n";
                    }
                    if (part.functionCall) {
                        isFunctionCall = true;
                        const fnName = part.functionCall.name;
                        const fnArgs = part.functionCall.args;
                        
                        const contentDiv = document.getElementById('content-' + groupThinkId);
                        if (contentDiv) {
                            contentDiv.innerHTML += `
                                <div>
                                    <div style="font-weight: 700; color: #475569; margin-bottom: 4px;"><i class="fa-solid fa-bolt" style="color: #f59e0b; margin-right: 5px;"></i>${fnName}</div>
                                    <div style="color: #94a3b8; font-size: 0.8rem; line-height: 1.4;">${JSON.stringify(fnArgs, null, 2)}</div>
                                </div>`;
                        }

                        // Eksekusi fungsi
                        const result = await executeTool(fnName, fnArgs);

                        // Masukkan balasan fungsi ke history
                        chatHistory.push({
                            role: 'user',
                            parts: [{
                                functionResponse: {
                                    name: fnName,
                                    response: { result: result }
                                }
                            }]
                        });
                        saveChat();
                    }
                }

                // Tutup details block setelah selesai jalan semua, agar rapi "kehide" (collapse)
                if (hasFunctionCalls) {
                    const groupThinkEl = document.getElementById(groupThinkId);
                    if (groupThinkEl) {
                        groupThinkEl.removeAttribute('open');
                        const icon = groupThinkEl.querySelector('summary i');
                        if (icon) {
                            icon.classList.remove('fa-spin', 'fa-gears');
                            icon.classList.add('fa-check-circle');
                            icon.style.color = 'var(--success)';
                        }
                        const title = document.getElementById('title-' + groupThinkId);
                        if (title) title.innerText = "Selesai eksekusi";
                    }
                }

                if (textToDisplay.trim() !== "") {
                    // Coba parse block <think> jika model mereply dengan raw think, jadikan collapsible
                    let formatted = textToDisplay.replace(/<think>([\s\S]*?)<\/think>/gi, (match, p1) => {
                        return `<details class="think-block"><summary><i class="fa-solid fa-lightbulb" style="color:#f59e0b;"></i> Pemikiran Agent</summary><div>${p1.trim()}</div></details>`;
                    });
                    
                    // Markdown parser
                    formatted = marked.parse(formatted);
                    appendMessage('ai', formatted);
                }

                // Jika ada pemanggilan fungsi, biarkan model memberikan jawaban final setelah mendapat data
                if (isFunctionCall) {
                    await processGeminiCall();
                }

            } catch (err) {
                removeLoading();
                appendMessage('ai', 'Gagal menghubungi server AI: ' + err.message);
                console.error(err);
            }
        }
    </script>
</body>
</html>
