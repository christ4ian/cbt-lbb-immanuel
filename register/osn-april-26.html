<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendaftaran Ditutup | LBB Immanuel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../register.css">
</head>
<body class="bg-body">

    <header class="ujian-header" style="justify-content: center;">
        <div class="header-left">
            <div class="logo-small"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="siswa-info">
                <span style="font-size: 1.1rem;">LBB IMMANUEL</span>
            </div>
        </div>
    </header>

    <div class="register-wrapper">
        <div class="register-card">
            
            <div id="layar-closed" style="text-align: center; padding: 20px 0;">
                <i class="fa-solid fa-lock" style="font-size: 5rem; color: #e74c3c; margin-bottom: 20px;"></i>
                <h2 style="margin-top: 0; color: #333; font-family: var(--font-heading);">Pendaftaran Ditutup! 🔒</h2>
                <p style="color: #666; font-size: 1.05rem; line-height: 1.6; margin-bottom: 30px;">
                    Maaf, pendaftaran Try Out OSN-K saat ini sudah ditutup.<br>
                    Terima kasih atas antusiasmenya dan sampai jumpa di event selanjutnya! ✨
                </p>

                <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 25px 0;">

                <div style="background-color: #f8f9fa; border: 2px dashed #007bff; border-radius: 12px; padding: 25px 15px;">
                    <h3 style="margin-top: 0; color: #007bff; margin-bottom: 10px;">Ingin mengerjakan ujian? 📝</h3>
                    <p style="color: #555; font-size: 0.95rem; margin-bottom: 20px;">Silakan login dan kerjakan ujianmu melalui portal CBT kami di bawah ini:</p>
                    
                    <a href="https://cbt.lbbimmanuel.com" style="display: inline-block; background-color: #007bff; color: white; text-decoration: none; padding: 14px 28px; border-radius: 8px; font-weight: bold; font-size: 1.05rem; transition: all 0.3s ease; box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);">
                        <i class="fa-solid fa-laptop-code" style="margin-right: 8px;"></i> Buka cbt.lbbimmanuel.com
                    </a>
                </div>

            </div>

        </div>
    </div>

</body>
</html>
