<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pendaftaran Ditutup | LBB Immanuel</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../style.css">

<body class="bg-body">

    <header class="ujian-header" style="justify-content: center;">

    <div class="register-wrapper">
        <div class="register-card" style="text-align: center; padding: 40px 20px;">

            <h2 style="margin-top: 0; color: #333; font-family: var(--font-heading);">Maaf, Pendaftaran Ditutup 😔</h2>

            </p>

            <hr style="border: 0; border-top: 1px dashed #cbd5e1; margin: 25px 0;">

            <a href="https://cbt.lbbimmanuel.com" class="btn-login" style="display: block; text-align: center; width: 100%; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; text-decoration: none; box-sizing: border-box; margin-bottom: 15px;">
                YA, KERJAKAN UJIAN <i class="fa-solid fa-laptop-code" style="margin-left: 5px;"></i>
            </a>

            <a href="https://www.instagram.com/lbbimmanuel/" target="_blank" style="display: block; text-align: center; width: 100%; padding: 14px; border-radius: 8px; font-size: 1.05rem; font-weight: bold; text-decoration: none; box-sizing: border-box; background-color: #f1f5f9; color: #334155; border: 2px solid #e2e8f0; transition: 0.3s;">
                <i class="fa-brands fa-instagram" style="color: #E1306C; font-size: 1.3rem; vertical-align: middle; margin-right: 5px;"></i> Info Lanjut di IG LBB Immanuel
